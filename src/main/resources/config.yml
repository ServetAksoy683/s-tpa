# =========================================
#  S-Tpa Config
# =========================================
# language: turkish, russia veya english
language: turkish

# Bir istegin kac saniye sonra kendiliginden gecersiz olacagi (0 = suresiz)
request-expire-seconds: 60

# Bir oyuncunun art arda /stpa gonderirken kac saniye beklemesi gerektigi (0 = cooldown yok)
cooldown-seconds: 5

# true olursa bir oyuncuya ayni anda birden fazla istek gonderilebilir,
# /stpaccept her seferinde en son gelen istegi kabul eder.
# false ise yeni istek eskisinin yerine gecer (varsayilan, basit davranis).
allow-multiple-requests: false

# Kabul edildikten sonra isinlanmadan once beklenecek sure (0 = aninda isinlan, varsayilan).
# 0'dan buyukse, bu sure icinde oyuncu hareket ederse veya hasar alirsa isinlanma iptal olur.
teleport-warmup-seconds: 0

# Ses efektleri. sound degerini bos birakirsan (sound: "") o olay icin ses calinmaz.
# Gecerli ses isimleri: https://jd.papermc.io/paper/1.20/org/bukkit/Sound.html
sounds:
  request-sent:
    sound: "ENTITY_EXPERIENCE_ORB_PICKUP"
    volume: 1.0
    pitch: 1.3
  request-received:
    sound: "BLOCK_NOTE_BLOCK_PLING"
    volume: 1.0
    pitch: 1.0
  teleport-success:
    sound: "ENTITY_ENDERMAN_TELEPORT"
    volume: 1.0
    pitch: 1.0
  warmup-tick:
    sound: "BLOCK_NOTE_BLOCK_HAT"
    volume: 0.6
    pitch: 1.5
  warmup-cancelled:
    sound: "ENTITY_VILLAGER_NO"
    volume: 1.0
    pitch: 1.0
  error:
    sound: "ENTITY_VILLAGER_NO"
    volume: 1.0
    pitch: 0.8
  admin-action:
    sound: "ENTITY_ENDER_DRAGON_GROWL"
    volume: 0.5
    pitch: 1.4

